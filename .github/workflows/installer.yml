name: Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - workers/install/**
      - scripts/install-runtime.sh
      - scripts/node-enrollment.sh
      - scripts/generated-version-map.sh
      - scripts/sync-release-from-fluxomni.py
      - docs/src/release-manifest.json
      - docker-compose*.yml
      - .env.example
      - tests/**
      - scripts/requirements-test.txt
      - scripts/capacity-upgrade.py
      - scripts/preparation-cgroup.py
      - scripts/verify-preparation-compose.py
      - .github/workflows/installer.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - workers/install/**
      - scripts/install-runtime.sh
      - scripts/node-enrollment.sh
      - scripts/generated-version-map.sh
      - scripts/sync-release-from-fluxomni.py
      - docs/src/release-manifest.json
      - docker-compose*.yml
      - .env.example
      - tests/**
      - scripts/requirements-test.txt
      - scripts/capacity-upgrade.py
      - scripts/preparation-cgroup.py
      - scripts/verify-preparation-compose.py
      - .github/workflows/installer.yml

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test public installer proxy
        run: node --test workers/install/test/*.test.mjs
      - name: Check installer syntax
        run: |
          for file in install.sh scripts/install-runtime.sh scripts/node-enrollment.sh; do bash -n "$file"; done
          shellcheck --severity=warning install.sh scripts/install-runtime.sh scripts/node-enrollment.sh
      - name: Check capacity helper
        run: uvx ruff check scripts/capacity-upgrade.py tests/test_capacity_upgrade.py
      - name: Test fresh installs and upgrades
        run: uv run --no-project --with-requirements scripts/requirements-test.txt pytest -q tests
