name: Docs

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - "README.md"
      - "Makefile"
      - "scripts/**"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "Makefile"
      - "scripts/**"
      - "docs/**"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.event.pull_request.number || 'site' }}

permissions:
  contents: read

env:
  MDBOOK_VERSION: "0.5.2"

jobs:
  lint:
    name: Lint Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'refs/heads/main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install mdBook
        run: cargo binstall --no-confirm "mdbook@${MDBOOK_VERSION}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Run docs lint
        run: make docs.lint.ci

      - name: Verify versioned build
        run: python3 scripts/build-versioned-docs.py --output "$RUNNER_TEMP/docs-check"

  publish:
    name: Publish Docs
    if: |
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
    needs:
      - lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'refs/heads/main' }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: cargo-bins/cargo-binstall@main

      - name: Install mdBook
        run: cargo binstall --no-confirm "mdbook@${MDBOOK_VERSION}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build versioned docs
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 scripts/build-versioned-docs.py \
            --output "$RUNNER_TEMP/docs-site" --base-path "$DOCS_BASE_PATH"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/docs-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
