"""
Input for creating a Drive folder sync source.
"""
input AddDriveSyncSourceInput {
	"""
	Operator-chosen display name. When missing or blank, the source uses
	the Drive folder name.
	"""
	name: String
	"""
	Ordinary Drive folder ID, chosen through the remote folder picker.
	"""
