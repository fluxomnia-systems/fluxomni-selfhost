"""
Fleet mutation root.
"""
type FleetMutation {
	"""
	Mark a registered media node as draining. Preconditions: the node must
	exist. Drain is a temporary scheduling command: the node stops accepting
	new placements, keeps assigned work while it still owns routes, and can
	recover to healthy once reachable and no longer assigned. Repeating the
	command is idempotent.
	"""
	drainMediaNode(
		"""
		Registered media-node identifier
		"""
		nodeId: MediaNodeId!
	): FleetNodeMutationResult!
	"""
	Force a registered media node into operator-held maintenance.
	Preconditions: the node must exist. Maintenance keeps the node offline
	for scheduling even if it remains reachable. Repeating the command is
	idempotent.
	"""
	enterMediaNodeMaintenance(
		"""
		Registered media-node identifier
		"""
		nodeId: MediaNodeId!
	): FleetNodeMutationResult!
	"""
	Clear operator-held maintenance for a registered media node.
	Preconditions: the node must exist. The command clears the maintenance
	override; liveness probing or registration then determines whether the
	node can return to healthy scheduling. Repeating the command is
	idempotent when maintenance is already cleared.
	"""
	exitMediaNodeMaintenance(
		"""
		Registered media-node identifier
		"""
		nodeId: MediaNodeId!
	): FleetNodeMutationResult!
	"""
	Permanently remove a media node record from the registry. Preconditions:
	use this only for a node that will never reconnect under the same id.
	The mutation clears the node's projected and runtime state and triggers
	a manifest rebuild so pending assignments are revoked. Use
	`drainMediaNode` for temporary removal.
	"""
	removeMediaNode(
		"""
		Registered media-node identifier
		"""
		nodeId: MediaNodeId!
	): FleetNodeMutationResult!
}

"""
Explicit result payload for fleet node command mutations.

`UPDATED` means the command changed node scheduling state or was accepted
for the target. `UNCHANGED` means the node was already in the requested
state or a permanent removal target was already absent. `NOT_FOUND` is
reserved for missing-node result paths; drain and maintenance commands
report unknown nodes as GraphQL errors with an extension code.
"""
type FleetNodeMutationResult {
	"""
	Mutation outcome status.
	"""
	status: MutationResultStatus!
	"""
	Media node identity associated with the command.
	"""
	nodeId: MediaNodeId!
}

