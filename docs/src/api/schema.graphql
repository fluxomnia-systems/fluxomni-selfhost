		routeSources: RouteSourcesInput!
	): RouteSourceMutationResult!
	"""
	Sets a new Route or updates an existing one (if `id` is specified).
	
	Idempotent if `id` is specified. Otherwise is non-idempotent, always creates a new Route.
	
	Returns a `RouteMutationResult` with `status` set to `UPDATED` for successful writes,
	and `NOT_FOUND` when the target Route is missing.
	"""
	setRoute(
		"""
		Route create/update payload.
		"""
		input: SetRouteInput!
	): RouteMutationResult!
	"""
	Assign or clear a route owner. Admin only.
	
	Returns a `RouteMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	setRouteOwner(
		"""
		ID of the Route to update
		"""
		id: RouteId!,
		"""
		User ID to own the route, or null to clear ownership
		"""
		ownerId: ID
	): RouteMutationResult!
	"""
	Sets, clears, or adopts the route baseline profile used to gate route media inputs.
	
	Returns a `RouteMutationResult` with `status` set to `UPDATED` or `NOT_FOUND`.
	"""
	setBaselineProfile(
		"""
		ID of the Route to update
		"""
		routeId: RouteId!,
		"""
		Preset id to set, or null to clear when sourceId and fileId are also null
		"""
		presetId: String,
		"""
		ID of the RouteSource whose observed stream should become the baseline
		"""
		sourceId: RouteSourceId,
		"""
		ID of the artifact file whose probed stream should become the baseline
		"""
		fileId: FileId
	): RouteMutationResult!
	"""
	Regenerate the publish token for a given route source.
	
	The old token is immediately invalidated. Returns a
	`PublishCredentialMutationResult` with `status` set to `UPDATED` or
	`NOT_FOUND`; the `token` field contains the new `pk_` token when updated.
	"""
	regeneratePublishCredential(
		"""
		ID of the Route to rotate the credential for.
		"""
		routeId: RouteId!,
		"""
		ID of the RouteSource whose token should be rotated.
		"""
		sourceId: RouteSourceId!
	): PublishCredentialMutationResult!
	"""
	Revoke a publish credential by regenerating the token (invalidating the
	old one). In the credential-in-spec model, tokens always exist on each
	push-protocol source — "revoking" means rotating so the old token
	stops working.
