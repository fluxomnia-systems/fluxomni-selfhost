"""
Unified Subscription root combining all domain subscriptions.

This struct merges subscriptions from all domain modules into a single GraphQL
Subscription type. Subscription fields remain flat at the root, while the
domain modules own the emitted streams. Most subscriptions are available to
all authenticated users, with fleet subscriptions restricted to Admin only.
"""
type UnifiedSubscription {
	"""
	Subscribe to all routes.
	"""
	allRoutes: [Route!]!
	"""
	Subscribe to server information updates.
	"""
	serverInfo: StatisticsServerInfo!
	"""
	Subscribe to status summary across all routes.
	"""
	statusSummary: RouteStatusSummary!
	"""
	Subscribe to a specific route used for nested outputs.
	"""
	routeWithParent(id: RouteId!): RouteWithParent
	"""
	Subscribe to one output within a specified route.
	"""
	output(
		"""
		ID of the Route
		"""
		routeId: RouteId!,
		"""
		ID of the Output
		"""
		outputId: OutputId!
	): Output
	"""
	Subscribe to artifact list changes.
	"""
	artifacts: [LocalFileInfo!]!
	"""
	Subscribe to a specific file's state changes.
	"""
	file(
		"""
		ID of the file to watch
		"""
		fileId: FileId!
	): LocalFileInfo
	"""
	Subscribe to currently playing file changes for a Route.
	"""
	currentlyPlayingFile(
		"""
		ID of the Route
		"""
		routeId: RouteId!
	): PlaylistFileInfo
	"""
	Subscribe to server settings changes.
	
	Emits the safe shell settings view whenever application settings change.
	"""
	info: SettingsInfo!
	"""
	Subscribe to media-node registry and liveness updates.
	"""
	mediaNodes: [FleetMediaNode!]!
}

