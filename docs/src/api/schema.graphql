	"""
	enableRoute(
		"""
		ID of the Route to be enabled.
		"""
		id: RouteId!
	): RouteMutationResult!
	"""
	Disables a Route by its ID.
	
	Returns a `RouteMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	disableRoute(
		"""
		ID of the Route to be disabled.
		"""
		id: RouteId!
	): RouteMutationResult!
	"""
	Disconnects one active playback consumer from this route.
	
	Returns a `RouteMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
