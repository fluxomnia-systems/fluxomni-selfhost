"""
Historical attribution, which grants no current object permission.
"""
type ChangeHistoryActor {
	"""
	Typed state or attribution category.
	"""
	kind: ChangeHistoryActorKind!
	"""
	Stable retained identity.
	"""
	id: String!
	"""
	Curated historical actor label.
	"""
	label: String!
}

"""
Stable actor category, independent of whether a user still exists.
"""
enum ChangeHistoryActorKind {
	"""
	Named user attribution, retained after account deletion.
	"""
	USER
	"""
	Internal or open-administrator attribution.
	"""
	SYSTEM
}

"""
Authorized root metadata for one complete retained change group.
"""
type ChangeHistoryChange {
	"""
	Stable retained identity.
	"""
	id: String!
	"""
	Full-precision stable sequence, represented as decimal text.
	"""
	sequence: String!
	"""
	Root command kind.
	"""
	operation: String!
	"""
	Historical attribution, independent of current authority.
	"""
	actor: ChangeHistoryActor!
	"""
	Accepted command entry point.
	"""
	origin: ChangeHistoryOrigin!
	"""
	Optional non-secret correlation identity.
	"""
	correlationId: String
	"""
	Optional public delegated client identity.
	"""
	clientId: String
	"""
	Unix milliseconds, represented as decimal text.
	"""
	committedAt: String!
	"""
	Whether original transaction atomicity is known.
	"""
	grouping: ChangeHistoryGrouping!
	"""
	Root result domain; complete group permissions are checked separately.
	"""
	primaryDomain: String!
	"""
	Root result entity; other effects can affect other entities.
	"""
	primaryEntityId: String!
	"""
	Physical counts and logical accounting use decimal strings without narrowing.
	"""
	entryCount: String!
	"""
	Physical effect count as a decimal string.
	"""
	effectCount: String!
	"""
	Physical field count as a decimal string.
	"""
	fieldCount: String!
	"""
	Stored logical accounting as a decimal string, excluding `SQLite` overhead.
	"""
	logicalBytes: String!
}

"""
Partial writer coverage; no pre-cutover edits are invented.
"""
type ChangeHistoryCoverage {
	"""
	Existing recorded domain.
	"""
	domain: String!
	"""
	Actual Unix-millisecond cutover marker, as decimal text.
	"""
	recordedSince: String!
	"""
	Actual persisted source of the marker.
	"""
	marker: ChangeHistoryCoverageMarker!
	"""
	Concrete covered command writers and exclusions.
	"""
	writerScope: String!
	"""
	Always false: this API does not promise every historical writer was journaled.
	"""
	coversAllWriters: Boolean!
}

"""
Actual persisted source of a declared writer cutover.
"""
enum ChangeHistoryCoverageMarker {
	"""
	An explicit domain marker created by the cutover.
	"""
	DOMAIN_CUTOVER
	"""
	The actual schema-ledger time for declared partial writers.
	"""
	MIGRATION_CUTOVER
}

"""
Complete bounded details; oversized or malformed details fail instead of truncating.
"""
type ChangeHistoryDetail {
	"""
	Authorized root metadata.
	"""
	change: ChangeHistoryChange!
	"""
	Complete bounded validated effects.
	"""
	effects: [ChangeHistoryEffect!]!
}

"""
Complete safe effect, with full-range revision strings.
"""
type ChangeHistoryEffect {
	"""
	First physical change identity for this logical effect.
	"""
	changeId: String!
	"""
	Exact affected domain.
	"""
	domain: String!
	"""
	Exact affected entity; input requires a domain.
	"""
	entityId: String!
	"""
	Prior full-range revision string, absent for new entities.
	"""
	beforeRevision: String
	"""
	Resulting full-range revision string.
	"""
	afterRevision: String!
	"""
	Complete reconstructed field transitions with protected markers redacted.
	"""
	fields: [ChangeHistoryField!]!
}

"""
Category is explicit for new facts and conservative for retained events.
"""
enum ChangeHistoryEventCategory {
	"""
	Explicitly recorded operational fact, not a committed configuration edit.
	"""
	OPERATIONAL
	"""
	Explicitly recorded failed attempt; collection is not globally complete.
	"""
	FAILED_ATTEMPT
	"""
	Retained event without a trustworthy old category.
	"""
	UNCLASSIFIED
}

"""
A typed event fact, without an invented before/after transition.
"""
type ChangeHistoryEventField {
	"""
	Curated event field name.
	"""
	name: String!
	"""
	Validated safe value with protected markers redacted.
	"""
	value: ChangeHistoryValue!
}

"""
Independent bounded event cursor; change cursors cannot be reused here.
"""
input ChangeHistoryEventInput {
	"""
	Exact category, or all explicitly recorded categories.
	"""
	category: ChangeHistoryEventCategory
	"""
	Visible result limit, default 20 and maximum 100.
	"""
	first: Int
	"""
	Prior event continuation for this administrator and category.
	"""
	after: String
}

"""
Event pages use a separate sequence stream from committed changes.
"""
type ChangeHistoryEventPage {
	"""
	Validated administrator-authorized event facts.
	"""
	nodes: [ChangeHistorySystemEvent!]!
	"""
	Continuation after the last returned event.
	"""
	nextCursor: String
	"""
	Fixed inclusive event watermark as decimal text.
	"""
	watermark: String!
}

"""
One complete, validated logical field transition.
"""
type ChangeHistoryField {
	"""
	Curated logical field name.
	"""
	name: String!
	"""
	Distinct state before the change.
	"""
	before: ChangeHistoryValue!
	"""
	Distinct state after the change, or the prior page continuation for input.
	"""
	after: ChangeHistoryValue!
}

"""
Whether historical transaction grouping is known.
"""
enum ChangeHistoryGrouping {
	"""
	All parts were appended in one known native transaction.
	"""
	EXPLICIT
	"""
	Retained actor/correlation provenance; original atomicity is unknown.
	"""
	RETAINED_CORRELATION
}

"""
Exact filters and one bounded cursor page.
"""
input ChangeHistoryInput {
	"""
	Current user by default; wider scopes require administrator authority.
	"""
