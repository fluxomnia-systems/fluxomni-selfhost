type ArtifactsMutation {
	retrySlideshow(operationId: String!, requestId: UUID!): SlideshowMutationResult!
	saveSlideshow(input: SaveSlideshowInput!): SlideshowMutationResult!
	cancelSlideshow(operationId: String!, requestId: UUID!): SlideshowMutationResult!
	retryThumbnail(fileId: FileId!): Boolean!
	"""
	Creates or resumes preservation by canonical recording ID; repeated requests reuse stored intent.
	"""
	preserveRecording(recordingId: FileId!): RecordingPreservation!
	cancelRecordingPreservation(operationId: String!): RecordingPreservation!
	"""
	Downloads a Google Drive file, or the direct-child video, image and audio files of a folder.
	"""
	downloadFile(
		"""
		ID of the Google Drive file or folder to import.
		"""
		fileId: FileId!,
		"""
		Authorization method. Required when both Drive methods are configured.
		"""
		access: GoogleDriveAccess
	): FileMutationResult!
	"""
	Creates a Drive folder sync source after verifying the folder is
	accessible through the chosen access method.
	"""
	addDriveSyncSource(input: AddDriveSyncSourceInput!): DriveSyncSource!
	"""
	Removes a Drive folder sync source; already imported artifacts stay in
	the library.
	"""
	removeDriveSyncSource(
		"""
		Sync source identity.
		"""
		sourceId: String!
	): FileMutationResult!
	"""
	Runs one bounded scan of a Drive folder sync source: lists direct-child
	videos and queues downloads for the ones without a catalog row yet.
	"""
	scanDriveSyncSource(
		"""
		Sync source identity.
		"""
		sourceId: String!
	): DriveSyncScanResult!
	"""
	Renames a reusable library file.
	"""
	renameLibraryFile(input: RenameLibraryFileInput!): LibraryFileMutationResult!
	"""
	Adds one or more tags to reusable library files atomically.
	"""
	addFileTags(input: LibraryFileTagsInput!): BulkLibraryFileMutationResult!
	"""
	Removes one or more tags from reusable library files atomically.
	"""
	removeFileTags(input: LibraryFileTagsInput!): BulkLibraryFileMutationResult!
	"""
	Records a derived artifact in the shared library catalog.
	"""
	recordDerivedArtifact(input: RecordDerivedArtifactInput!): LibraryFileMutationResult!
	"""
	Deletes unused reusable library files.
	"""
	deleteLibraryFiles(ids: [FileId!]!): LibraryDeleteResult!
	"""
	Detaches route references and deletes reusable library files.
	"""
	forceDeleteLibraryFiles(ids: [FileId!]!): LibraryDeleteResult!
	"""
	Cancel download of a file by its ID.
	"""
	cancelFileDownload(
		"""
		ID of the file to cancel download.
		"""
		fileId: FileId!
	): FileMutationResult!
}

type ArtifactsQuery {
	"""
	Available import methods. This response contains no credential material.
	"""
	googleDriveAccess: GoogleDriveAccessInfo!
	slideshows: [Slideshow!]!
	libraryThumbnails(fileIds: [FileId!]!): [LibraryThumbnailUpdate!]!
	"""
	Durable progress and result for a canonical recording preservation.
	"""
	recordingPreservation(recordingId: FileId!): RecordingPreservation
	"""
	Returns a bounded page of library files; filters apply to the whole catalog.
	"""
	libraryFiles(		filter: LibraryFileFilter,
		"""
		Page size, from 1 to 200; defaults to 50.
		"""
		first: Int! = 50,
		"""
		Opaque continuation token from endCursor; omit for the first page.
		"""
		after: String,
		"""
		Whole-catalog ordering; reset the cursor when changing it.
		"""
		sort: LibraryFileSort! = NAME
	): LibraryFilePage!
	"""
	Returns one reusable library file by id with artifact metadata.
	"""
	libraryFile(id: FileId!): LibraryFile
	"""
	Returns the workspace tag summary for library files.
	"""
	libraryTags: [LibraryTag!]!
	"""
	Lists configured remote Drive folder sync sources with their scan status.
	"""
	driveSyncSources: [DriveSyncSource!]!
	"""
	Lists one page of a remote source folder for browsing; `root` opens the
	credential-visible Drive root.
	"""
	remoteFolder(		provider: RemoteSourceProvider!,
		"""
		Folder ID, or `root` for the provider root. `shared` opens Shared with me.
		"""
		folderId: FileId!,
		"""
		Opaque continuation token from nextPageToken.
		"""
		pageToken: String,
		"""
		Authorization method. Required when both Drive methods are configured.
		"""
		access: GoogleDriveAccess
	): RemoteFolderPage!
}

