		"""
		sourceId: RouteSourceId!
	): PublishCredentialMutationResult!
	"""
	Enables an Output by its ID in the specified Route.
	
	Returns an `OutputMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	enableOutput(
		"""
		ID of the Output to be enabled.
		"""
		id: OutputId!,
		"""
		ID of the Route to enable the Output in.
		"""
		routeId: RouteId!
