"""
Whether the published location is durable artifact authority.
"""
enum ArtifactAuthority {
	"""
	The location is the durable catalog authority for the artifact bytes.
	"""
	DURABLE
	"""
	The location is a temporary relay or cache copy and not durable truth.
	"""
	NON_DURABLE
}

"""
Catalog entry for a tracked asset or derived artifact with explicit policy metadata.
"""
type ArtifactCatalogEntry {
