	"""
	Exact affected domain.
	"""
	domain: String
	"""
	Exact affected entity; input requires a domain.
	"""
	entityId: String
	"""
	Optional non-secret correlation identity.
	"""
	correlationId: UUID
	"""
	Visible result limit, default 20 and maximum 100.
	"""
	first: Int
	"""
	Prior opaque page continuation.
	"""
	after: String
}

"""
Accepted command entry point.
"""
enum ChangeHistoryOrigin {
	"""
	Browser command.
	"""
	BROWSER
	"""
	Delegated MCP command.
	"""
	MCP
	"""
	Accepted API command.
	"""
	API
	"""
	Internal lifecycle command.
	"""
	SYSTEM
}

"""
A page may be empty while unavailable candidates are skipped.
"""
type ChangeHistoryPage {
	"""
	Authorized complete-change metadata.
	"""
	nodes: [ChangeHistoryChange!]!
	"""
	Continuation after the last considered candidate. More candidates can still be unavailable.
	"""
	nextCursor: String
	"""
	Fixed inclusive sequence watermark as a decimal string.
	"""
	watermark: String!
}

type ChangeHistoryQuery {
	"""
	Administrator-only available records in a frozen rolling 24-hour window.
	"""
	adminHistory(input: AdminHistoryInput): AdminHistoryPage!
	"""
	Actual declared-writer cutovers; all historical writers are not claimed as covered.
	"""
	coverage: [ChangeHistoryCoverage!]!
	"""
