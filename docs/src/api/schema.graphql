	Whether this is a canonical node-owned recording without pending deletion.
	"""
	nodeRecording: Boolean!
	"""
	Semantic role of this asset or artifact.
	"""
	kind: ArtifactKind!
	"""
	Location contract used for node-side fetch and publishing.
	"""
	location: ArtifactLocation!
	"""
	Explicit publish metadata carried alongside the location.
	"""
	publish: ArtifactPublishMetadata!
	"""
	Explicit lookup metadata carried alongside the location.
	"""
	lookup: ArtifactLookupMetadata!
	"""
	Explicit lifecycle policy carried alongside the location.
	"""
	lifecycle: ArtifactLifecycleMetadata!
}

enum ArtifactDuplicateImportPolicy {
	MERGE
	IGNORE
	REPLACE
}

"""
Canonical asset/artifact role carried by the catalog.
"""
