		consumerId: String!
	): RouteMutationResult!
	"""
	Removes a Route by its ID.
	Returns a `RouteMutationResult` with `status` set to `UPDATED` or `NOT_FOUND`.
	"""
	removeRoute(
		"""
		ID of the Route to be removed.
		"""
		id: RouteId!
	): RouteMutationResult!
	"""
	Change order of Routes depending on the order of their IDs.
	"""
	changeRoutesOrder(
		"""
		Ordered list of Route identities
		"""
		ids: [RouteId!]!
	): BulkRouteMutationResult!
	"""
	Sets the preferred route source.
	
	Returns a `RouteSourceMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	preferRouteSource(
		"""
		ID of the Route to set the preferred source on
