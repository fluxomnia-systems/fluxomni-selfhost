"""
Recorded actor category; unavailable event attribution is not inferred.
"""
enum AdminHistoryActor {
	"""
	All actors and unavailable attribution.
	"""
	ALL
	"""
	A selected historical user.
	"""
	USER
	"""
	Internal or open-administrator actor.
	"""
	SYSTEM
	"""
	Events without actor attribution.
	"""
	UNAVAILABLE
}

"""
Filters and independent section continuations for an administrator window.
"""
input AdminHistoryInput {
	"""
	Defaults to successful committed changes.
	"""
	outcome: AdminHistoryOutcome! = SUCCESSFUL
	"""
	Actor category; defaults to all actors.
	"""
	actor: AdminHistoryActor! = ALL
	"""
	Required for USER and forbidden for other actor selections; deleted users remain valid.
	"""
	userId: UUID
	"""
	Recorded affected domain. Unattributed events do not match.
	"""
	domain: String
	"""
	Per-section page limit, 1 to 100; default 20.
	"""
	first: Int
	"""
	Return this unchanged to preserve the window and both watermarks.
	"""
	snapshot: String
	"""
	Changes continuation. When provided alone, the events section is not read.
	"""
	changesAfter: String
	"""
	Events continuation. When provided alone, the changes section is not read.
	"""
	eventsAfter: String
}

"""
Recorded outcomes do not imply complete attempt collection.
"""
enum AdminHistoryOutcome {
	"""
	Successful committed state changes only.
	"""
	SUCCESSFUL
	"""
	Only persisted failed-attempt facts.
	"""
	RECORDED_FAILURES
	"""
	Changes and all recorded events, including unclassified facts.
	"""
	ALL_RECORDED
}

"""
Separate sequence-ordered sections. Available records are not a complete audit.
"""
type AdminHistoryPage {
	"""
	Frozen window and both sequence watermarks, bound to filters and authority.
	"""
	snapshot: String!
	"""
	Inclusive Unix milliseconds as decimal text.
	"""
	start: String!
	"""
	Exclusive Unix milliseconds as decimal text.
	"""
	end: String!
	"""
	Successful committed changes, not proof of physical delivery.
	"""
	changes: ChangeHistoryPage!
	"""
	Explicit events. Actor, target, domain and origin attribution are unavailable.
	"""
	events: ChangeHistoryEventPage!
}

