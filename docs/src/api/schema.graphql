	"""
	Enables a configured route source.
	
	Returns a `RouteSourceMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	enableRouteSource(
		"""
		ID of the Route containing the source
		"""
		routeId: RouteId!,
		"""
		ID of the RouteSource to enable
		"""
		sourceId: RouteSourceId!
	): RouteSourceMutationResult!
	"""
	Disables a configured route source.
	
	Returns a `RouteSourceMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	disableRouteSource(
		"""
		ID of the Route containing the source
		"""
		routeId: RouteId!,
		"""
		ID of the RouteSource to disable
		"""
		sourceId: RouteSourceId!
	): RouteSourceMutationResult!
	"""
	Updates the label of a configured route source.
	
	Returns a `RouteSourceMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	updateRouteSourceLabel(
		"""
		ID of the Route containing the source
		"""
		routeId: RouteId!,
		"""
		ID of the RouteSource to update the label for
		"""
		sourceId: RouteSourceId!,
		"""
		New label for the route source, or null to clear the label
		"""
		label: Label
	): RouteSourceMutationResult!
	"""
	Updates the failover policy for the specified Route's source set.
	
	Allows tuning failover behavior without full route-source reconstruction.
	Returns a `RouteSourceMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	updateRouteSourcesFailoverPolicy(
		"""
		ID of the Route to update the route-source failover policy for
		"""
		routeId: RouteId!,
		"""
		New failover policy settings for the route source set
		"""
		policy: RouteSourceFailoverPolicyInput!
	): RouteSourceMutationResult!
	"""
	Updates the configured source topology for a Route without changing other Route settings.
	
	This is the source-management counterpart to `setRoute`: it replaces the route-source
	list and failover policy while preserving route identity, label, outputs, playlist,
	baseline, ownership, and source preference when the preferred source still exists.
	"""
	updateRouteSources(
		"""
