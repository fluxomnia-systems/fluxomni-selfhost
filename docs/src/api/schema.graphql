	removeOutput(
		"""
		ID of the Output to be removed.
		"""
		id: OutputId!,
		"""
		ID of the Route to remove the Output from.
		"""
		routeId: RouteId!
	): OutputMutationResult!
	"""
	Enables all outputs in the specified Route.
