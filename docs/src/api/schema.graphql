type SystemSettingsMutation {
	"""
	Compatibility password mutation for admin clients.
	
	Named users should prefer `changeMyPassword`. This legacy alias continues
	to target the current named user when one exists, and otherwise falls back
	to the bootstrap `admin` account for non-user admin principals.
	
	# Arguments
	
	* `new` - New password to set (empty string removes auth only while the bootstrap admin is the sole user)
	* `old` - Current password (required if password is already set)
	"""
	setPassword(
		"""
		Password update payload.
		"""
		input: PasswordMutationInput!
	): PasswordMutationResult!
	"""
	Change the current named user's password.
	"""
	changeMyPassword(
		"""
		Password update payload.
		"""
		input: PasswordMutationInput!
	): PasswordMutationResult!
	"""
	Create a local user account.
	"""
	createUser(
		"""
		User creation payload.
		"""
		input: CreateUserInput!
	): UserMutationResult!
	"""
	Update one user's effective role.
	"""
	updateUserRole(
		"""
		User role update payload.
		"""
		input: UpdateUserRoleInput!
	): UserMutationResult!
	"""
	Delete one persisted local user.
	"""
	deleteUser(
		"""
		User id
		"""
		id: String!
	): UserMutationResult!
	"""
	Update application settings.
	
	Allows configuration of various application parameters including:
	- Display title
	- Confirmation dialogs
	- Google Drive API key
	- Maximum downloading files
	- Browser session TTL (seconds)
	"""
	setSettings(
		"""
		Application settings update payload.
		"""
		input: SetSettingsInput!
	): SettingsMutationResult!
	"""
	Import routes configuration from JSON.
	
	This will merge or replace the current configuration with the imported one.
	Use with caution as this operation cannot be undone.
	
	# Arguments
	
	* `spec` - JSON string containing the routes configuration
	* `replace` - Indicator whether the spec should replace existing definitions
	* `routeId` - Optional ID of a concrete Route to apply the spec to without touching other Routes
	
	Returns a `SettingsImportMutationResult` with `status` set to `UPDATED`, `UNCHANGED`, or `NOT_FOUND`.
	"""
	import(
		"""
		JSON spec to import
		"""
		spec: String!,
		"""
		Indicator whether the spec should replace existing definitions
		"""
		replace: Boolean! = false,
		"""
		Optional ID of a concrete Route to apply the spec to without touching other Routes
		"""
		routeId: RouteId
	): SettingsImportMutationResult!
}

